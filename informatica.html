    <style>
        :root {
            /* Tema Escuro (Padrão) */
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-hover: rgba(51, 65, 85, 0.85);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --section-title-color: #cbd5e1;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --border-card: rgba(255, 255, 255, 0.1);
            --shadow-text: rgba(0, 0, 0, 0.5);

            /* Cores para o Switch 3D (Escuro) */
            --switch-bg: #1e293b;
            --switch-border: #334155;
            --switch-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6), inset 0 -1px 2px rgba(255, 255, 255, 0.1), 0 4px 10px rgba(0, 0, 0, 0.3);
            --knob-bg: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            --knob-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        /* Tema Claro */
        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-hover: rgba(241, 245, 249, 0.95);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --section-title-color: #334155;
            --accent-color: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
            --border-card: rgba(0, 0, 0, 0.08);
            --shadow-text: transparent;

            /* Cores para o Switch 3D (Claro) */
            --switch-bg: #e2e8f0;
            --switch-border: #cbd5e1;
            --switch-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.15), inset 0 -1px 2px rgba(255, 255, 255, 0.8), 0 4px 10px rgba(0, 0, 0, 0.08);
            --knob-bg: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            --knob-shadow: 0 4px 8px rgba(217, 119, 6, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Botão Switch 3D Intuitivo */
        .theme-switch-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .theme-switch {
            position: relative;
            width: 74px;
            height: 38px;
            background: var(--switch-bg);
            border: 1px solid var(--switch-border);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: var(--switch-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .theme-switch:hover {
            transform: translateY(-2px);
        }

        .theme-switch:active {
            transform: translateY(0);
        }

        .theme-switch .icon-moon {
            font-size: 19px;
            color: #0f172a;
            z-index: 1;
        }

        .theme-switch .icon-sun {
            font-size: 19px;
            color: #f8fafc;
            z-index: 1;
        }

        /* Círculo Deslizante 3D (Knob) */
        .theme-switch-knob {
            position: absolute;
            top: 3px;
            left: 4px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--knob-bg);
            box-shadow: var(--knob-shadow);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animação do Knob para Modo Claro */
        body.light-mode .theme-switch-knob {
            transform: translateX(34px);
        }

        /* Container Principal ampliado para caber 5 colunas */
        .container {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            position: relative;
            z-index: 1;
        }

        /* Canvas Interativo em Fundo Fixo */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: auto;
        }

        /* Botão de Voltar */
        .back-nav {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 10px 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-btn i {
            font-size: 12px;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            background: var(--card-hover);
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateX(-3px);
        }

        .back-btn:hover i {
            transform: translateX(-3px);
        }

        /* Cabeçalho */
        .profile-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-header h1 {
            font-size: 35px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px var(--shadow-text);
            color: var(--text-primary);
        }

        /* Estilo para a imagem 123 */
        .header-image-container {
            width: auto;
            max-width: 320px;
            height: auto;
            margin: 0 auto 15px auto;
            background: transparent;
            border: none;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .profile-header p {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
            text-shadow: 0 1px 5px var(--shadow-text);
        }

        /* Secção de Galeria de Fotos */
        .section-title {
            width: 100%;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--section-title-color);
            margin: 20px 0 16px 5px;
            font-weight: 600;
            text-shadow: 0 1px 4px var(--shadow-text);
        }

        /* Grelha de 5 colunas com adaptação para 2 colunas em dispositivos móveis */
        .gallery-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        @media (max-width: 1100px) {
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .theme-switch-wrapper {
                top: 15px;
                right: 15px;
            }
            .theme-switch {
                width: 64px;
                height: 34px;
            }
            .theme-switch-knob {
                width: 26px;
                height: 26px;
            }
            body.light-mode .theme-switch-knob {
                transform: translateX(30px);
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            
            .container {
                padding: 20px 5px;
            }
        }

        .gallery-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px -1px rgba(0, 0, 0, 0.08);
            aspect-ratio: 1 / 1;
            cursor: pointer;
        }

        .gallery-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);
        }

        .image-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--card-bg);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover .image-container img {
            transform: scale(1.08);
        }

        /* Estilos do Modal (Visualização Ampliada) */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .modal-content-wrapper {
            position: relative;
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: modalScale 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes modalScale {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content-wrapper img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px;
            display: block;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .modal-nav:hover {
            background: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        .modal-prev {
            left: -20px;
        }

        .modal-next {
            right: -20px;
        }

        @media (max-width: 768px) {
            .modal-prev { left: 10px; }
            .modal-next { right: 10px; }
        }

        /* Botão Flutuante do WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: #ffffff;
            width: 60px;
            height: 60px;
            border-radius: 50px;
            text-align: center;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            background-color: #20ba5a;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 30px;
            text-shadow: 0 1px 4px var(--shadow-text);
        }

        footer span {
            color: var(--accent-color);
            font-weight: 600;
        }
    </style>
</head>

        </footer>

    <!-- Modal para Visualização da Foto Ampliada com setas -->
    <div id="imageModal" class="image-modal">
        <div class="modal-content-wrapper">
            <div class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></div>
            <div class="modal-nav modal-prev" id="modalPrev"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="modal-nav modal-next" id="modalNext"><i class="fa-solid fa-chevron-right"></i></div>
            <img id="modalImg" alt="Foto Ampliada">
        </div>
    </div>

    <!-- Script de Fundo Interativo, Tema e Modal -->
    <script>
        // Gestão do Tema (Claro / Escuro)
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        // Carregar preferência salva ao iniciar
        (function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        })();

        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalClose = document.getElementById('modalClose');
        const modalPrev = document.getElementById('modalPrev');
        const modalNext = document.getElementById('modalNext');
        const galleryCards = document.querySelectorAll('.gallery-card');

        const imagesList = Array.from(galleryCards).map(card => card.querySelector('img').src);
        let currentIndex = 0;

        galleryCards.forEach((card, index) => {
            card.addEventListener('click', () => {
                currentIndex = index;
                updateModalImage();
                modal.classList.add('active');
            });
        });

        function updateModalImage() {
            modalImg.src = imagesList[currentIndex];
        }

        function showPrevImage(e) {
            if (e) e.stopPropagation();
            currentIndex = (currentIndex - 1 + imagesList.length) % imagesList.length;
            updateModalImage();
        }

        function showNextImage(e) {
            if (e) e.stopPropagation();
            currentIndex = (currentIndex + 1) % imagesList.length;
            updateModalImage();
        }

        function closeModal() {
            modal.classList.remove('active');
            modalImg.src = '';
        }

        modalClose.addEventListener('click', closeModal);
        modalPrev.addEventListener('click', showPrevImage);
        modalNext.addEventListener('click', showNextImage);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') showPrevImage();
            if (e.key === 'ArrowRight') showNextImage();
        });

        // Script de Fundo Interativo
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let ripples = [];

        const mouse = { x: null, y: null, radius: 150 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('click', (e) => { 
            if (!modal.contains(e.target)) {
                createRipple(e.clientX, e.clientY); 
            }
        });

        function createRipple(x, y) {
            ripples.push({ x: x, y: y, radius: 5, maxRadius: 180, alpha: 1 });
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i;
                const speed = Math.random() * 3 + 2;
                particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, Math.random() * 2.5 + 1, true));
            }
        }

        class Particle {
            constructor(x, y, vx, vy, size, isBurst = false) {
                this.x = x !== undefined ? x : Math.random() * width;
                this.y = y !== undefined ? y : Math.random() * height;
                this.vx = vx !== undefined ? vx : (Math.random() - 0.5) * 1.2;
                this.vy = vy !== undefined ? vy : (Math.random() - 0.5) * 1.2;
                this.radius = size !== undefined ? size : Math.random() * 2 + 1;
                const colors = ['#38bdf8', '#818cf8', '#60a5fa', '#a7f3d0'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.isBurst = isBurst;
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.008;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.isBurst) {
                    this.life -= this.decay;
                } else {
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let maxDistance = mouse.radius;
                        let force = (maxDistance - distance) / maxDistance;
                        this.x -= forceDirectionX * force * 3;
                        this.y -= forceDirectionY * force * 3;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.isBurst ? Math.max(0, this.life) : 0.8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((width * height) / 10000);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            const maxDistance = 120;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < maxDistance) {
                        let opacity = 1 - (distance / maxDistance);
                        ctx.save();
                        ctx.strokeStyle = `rgba(56, 189, 248, ${opacity * 0.25})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = particles[a].x - mouse.x;
                    let dy = particles[a].y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let opacity = 1 - (distance / mouse.radius);
                        ctx.save();
                        ctx.strokeStyle = `rgba(129, 140, 248, ${opacity * 0.4})`;
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }
        }

        function handleRipples() {
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                r.radius += 3;
                r.alpha -= 0.015;
                if (r.alpha <= 0 || r.radius >= r.maxRadius) {
                    ripples.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(56, 189, 248, ${r.alpha})`;
                ctx.lineWidth = 2;
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;
                ctx.stroke();
                ctx.restore();
            }
        }

        function animate() {
            const isLight = document.body.classList.contains('light-mode');
            ctx.fillStyle = isLight ? '#f1f5f9' : '#0f172a';
            ctx.fillRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.isBurst && p.life <= 0) particles.splice(i, 1);
            }

            connectParticles();
            handleRipples();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resize();
            animate();
        };
    </script>
</body>
