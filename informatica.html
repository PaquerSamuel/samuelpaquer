<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informática Paquer - Samuel Paquer de Souza</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-hover: rgba(51, 65, 85, 0.85);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Container Principal ampliado para caber 4 colunas */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            position: relative;
            z-index: 1;
        }

        /* Canvas Interativo em Fundo Fixo */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: auto;
        }

        /* Botão de Voltar */
        .back-nav {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            background: var(--card-hover);
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateX(-3px);
        }

        /* Cabeçalho */
        .profile-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        .profile-header p {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
        }

        /* Secção de Galeria de Fotos */
        .section-title {
            width: 100%;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #cbd5e1;
            margin: 20px 0 16px 5px;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        /* Grelha de 4 colunas por 5 linhas */
        .gallery-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

        .gallery-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px -1px rgba(0, 0, 0, 0.2);
            aspect-ratio: 1 / 1;
            cursor: pointer;
        }

        .gallery-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);
        }

        .image-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e293b;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover .image-container img {
            transform: scale(1.08);
        }

        /* Estilos do Modal (Visualização Ampliada) */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .modal-content-wrapper {
            position: relative;
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: modalScale 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modalScale {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content-wrapper img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px;
            display: block;
        }

        .modal-close {
            position: absolute;
            top: 22px;
            right: 22px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        /* Botão Flutuante do WhatsApp */
        .whatsapp-float {
            position: fixed;

            right: 25px;
            background-color: #25d366;
            color: #ffffff;

            height: 60px;
            border-radius: 50px;
            text-align: center;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            background-color: #20ba5a;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);

        footer {

            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 30px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        footer span {
            color: var(--accent-color);
            font-weight: 600;
        }
    </style>

    <!-- Script de Fundo Interativo e Modal -->
    <script>
        // Lógica do Modal de Imagens
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalClose = document.getElementById('modalClose');
        const galleryCards = document.querySelectorAll('.gallery-card');

        galleryCards.forEach(card => {
            card.addEventListener('click', () => {
                const img = card.querySelector('img');
                modalImg.src = img.src;
                modal.classList.add('active');
            });
        });

        function closeModal() {
            modal.classList.remove('active');
            modalImg.src = '';
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Script de Fundo Interativo
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let ripples = [];

        const mouse = { x: null, y: null, radius: 150 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('click', (e) => { createRipple(e.clientX, e.clientY); });

        function createRipple(x, y) {
            ripples.push({ x: x, y: y, radius: 5, maxRadius: 180, alpha: 1 });
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i;
                const speed = Math.random() * 3 + 2;
                particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, Math.random() * 2.5 + 1, true));
            }
        }

        class Particle {
            constructor(x, y, vx, vy, size, isBurst = false) {
                this.x = x !== undefined ? x : Math.random() * width;
                this.y = y !== undefined ? y : Math.random() * height;
                this.vx = vx !== undefined ? vx : (Math.random() - 0.5) * 1.2;
                this.vy = vy !== undefined ? vy : (Math.random() - 0.5) * 1.2;
                this.radius = size !== undefined ? size : Math.random() * 2 + 1;
                const colors = ['#38bdf8', '#818cf8', '#60a5fa', '#a7f3d0'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.isBurst = isBurst;
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.008;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.isBurst) {
                    this.life -= this.decay;
                } else {
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let maxDistance = mouse.radius;
                        let force = (maxDistance - distance) / maxDistance;
                        this.x -= forceDirectionX * force * 3;
                        this.y -= forceDirectionY * force * 3;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.isBurst ? Math.max(0, this.life) : 0.8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((width * height) / 10000);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            const maxDistance = 120;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < maxDistance) {
                        let opacity = 1 - (distance / maxDistance);
                        ctx.save();
                        ctx.strokeStyle = `rgba(56, 189, 248, ${opacity * 0.25})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = particles[a].x - mouse.x;
                    let dy = particles[a].y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let opacity = 1 - (distance / mouse.radius);
                        ctx.save();
                        ctx.strokeStyle = `rgba(129, 140, 248, ${opacity * 0.4})`;
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }
        }

        function handleRipples() {
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                r.radius += 3;
                r.alpha -= 0.015;
                if (r.alpha <= 0 || r.radius >= r.maxRadius) {
                    ripples.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(56, 189, 248, ${r.alpha})`;
                ctx.lineWidth = 2;
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;
                ctx.stroke();
                ctx.restore();
            }
        }

        function animate() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.isBurst && p.life <= 0) particles.splice(i, 1);
            }

            connectParticles();
            handleRipples();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resize();
            animate();
        };
    </script>
